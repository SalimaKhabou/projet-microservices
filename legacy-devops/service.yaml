apiVersion: v1
kind: Service
metadata:
  name: mysql
spec:
  selector:
    app: mysql
  ports:
    - port: 3306
---
apiVersion: v1
kind: Service
metadata:
  name: foyer-app-service
spec:
  type: NodePort
  selector:
    app: foyer-app
  ports:
    - port: 8082
      targetPort: 8082
      nodePort: 30000